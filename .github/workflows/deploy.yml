name: deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Не отменяем идущий деплой новым пушем: prod-job может ждать ручного аппрува.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # версия из package.json → packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: SKIP_ENV_VALIDATION=1 SKIP_LINT=1 pnpm build
      - name: Lint
        run: npx eslint . --no-cache # next lint флейкает на сортировке импортов; прямой eslint без кэша стабилен
      - name: Typecheck
        run: pnpm typecheck
      - name: Dangling exports
        run: pnpm check:exports

  deploy-test:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_TEST }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Check SSH and deployment directory
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_PATH" =~ ^/home/vladislav/[a-zA-Z0-9_-]+$ ]]
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$DEPLOY_PATH/.env' && test -f '$DEPLOY_PATH/docker-compose.yml' && test -r /home/vladislav/.config/selectel-deploy/build.env"
      - name: Rsync sources
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.next' \
            --exclude='.env*' --exclude='public/uploads' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Build and verify on server
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" < .github/scripts/deploy-on-server.sh
      - name: Check public HTTPS
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-connrefused --max-time 20 https://test.likostrade.com/

  deploy-prod:
    needs: [ci, deploy-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Check SSH and deployment directory
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_PATH" =~ ^/home/vladislav/[a-zA-Z0-9_-]+$ ]]
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$DEPLOY_PATH/.env' && test -f '$DEPLOY_PATH/docker-compose.yml' && test -r /home/vladislav/.config/selectel-deploy/build.env"
      - name: Rsync sources
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.next' \
            --exclude='.env*' --exclude='public/uploads' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Build and verify on server
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" < .github/scripts/deploy-on-server.sh
      - name: Check public HTTPS
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-connrefused --max-time 20 https://likostrade.com/
